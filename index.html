<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shape of My Heart - Backstreet Boys</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Background Gradasi Animasi Bergerak */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a1c20);
      background-size: 400% 400%;
      animation: gradientBg 12s ease infinite;
      color: #ffffff;
      padding: 20px;
      overflow-x: hidden;
    }

    @keyframes gradientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Container Utama dengan Efek Kaca (Glassmorphism) */
    .card-container {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      position: relative;
    }

    /* Vinyl / Piringan Hitam Animasi */
    .vinyl-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 20px;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #111 30%, #333 31%, #111 60%, #222 65%, #000 100%);
      border: 4px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }

    .vinyl.playing {
      animation-play-state: running;
    }

    .vinyl-cover {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Judul Lagu & Artis */
    .song-info h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .song-info p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
    }

    /* Tampilan Lirik Animasi */
    .lyrics-box {
      min-height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px;
    }

    .lyric-text {
      font-size: 1rem;
      font-weight: 400;
      font-style: italic;
      color: #e0e0e0;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease-in-out;
    }

    .lyric-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Kontrol Audio Custom */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .play-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #1a1c20;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .play-btn:hover {
      transform: scale(1.08);
      background: #f0f0f0;
    }

    /* Pesan Rahasia (Pesan Anonim) */
    .secret-message {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px;
      border-left: 4px solid #ff758c;
      text-align: left;
    }

    .secret-message .tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff758c;
      font-weight: 600;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .secret-message p {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #dddddd;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Vinyl Animation -->
    <div class="vinyl-wrapper">
      <div class="vinyl" id="vinyl">
        <!-- Sampul Album -->
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80" alt="Album Cover" class="vinyl-cover" />
      </div>
    </div>

    <!-- Informasi Lagu -->
    <div class="song-info">
      <h2>Shape of My Heart</h2>
      <p>Backstreet Boys</p>
    </div>

    <!-- Teks Lirik Berganti dengan Animasi -->
    <div class="lyrics-box">
      <div class="lyric-text active" id="lyricDisplay">Klik tombol Play untuk memulai lagu ✨</div>
    </div>

    <!-- Kontrol Pemutar Musik -->
    <div class="controls">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">
        <i class="fa-solid fa-play" id="playIcon"></i>
      </button>
    </div>

    <!-- Fitur Tambahan: Pesan Anonim -->
    <div class="secret-message">
      <div class="tag"><i class="fa-solid fa-envelope-open-text"></i> Pesan Rahasia</div>
      <p>"Lagu ini khusus dikirimkan buat kamu. Semoga harimu menyenangkan dan senyum terus ya! 💖"</p>
    </div>

    <!-- Elemen Audio (Pengganti URL Lagu) -->
    <audio id="myAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
  </div>

  <script>
    const audio = document.getElementById('myAudio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const vinyl = document.getElementById('vinyl');
    const lyricDisplay = document.getElementById('lyricDisplay');

    // Daftar Lirik "Shape of My Heart"
    const lyrics = [
      "Looking back on the things I've done...",
      "I was trying to be someone...",
      "Sadness, loneliness, take a look inside...",
      "Baby, please try to understand...",
      "I'm doing the best I can...",
      "To show you the shape of my heart ❤️"
    ];

    let lyricIndex = 0;
    let lyricInterval;

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
        vinyl.classList.add('playing');
        startLyrics();
      } else {
        audio.pause();
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
        vinyl.classList.remove('playing');
        stopLyrics();
      }
    }

    function startLyrics() {
      // Ganti lirik setiap 4 detik
      lyricInterval = setInterval(() => {
        lyricDisplay.classList.remove('active');
        
        setTimeout(() => {
          lyricIndex = (lyricIndex + 1) % lyrics.length;
          lyricDisplay.textContent = lyrics[lyricIndex];
          lyricDisplay.classList.add('active');
        }, 500); // Waktu jeda transisi fade-out ke fade-in
      }, 4000);
    }

    function stopLyrics() {
      clearInterval(lyricInterval);
    }
  </script>
</body>
</html>
